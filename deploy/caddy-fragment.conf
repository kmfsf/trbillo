# Trbillo Caddy snippet
#
# Replace `your-domain.com` below with your actual domain. Add the matcher
# and `handle` block INSIDE your existing site block in /etc/caddy/Caddyfile.
#
# Example shape:
#
#   your-domain.com {
#       # ... your other handles ...
#
#       # --- Trbillo (begin) ---
#       @trbillo path /trbillo /trbillo/*
#       handle @trbillo {
#           reverse_proxy localhost:8080
#       }
#       # --- Trbillo (end) ---
#   }
#
# Notes:
# - Use `handle`, not `handle_path`: the Go server expects the prefix
#   (BASE_PATH=/trbillo) on every route and strips nothing itself.
# - The bare /trbillo is routed to the server too; it answers with a 308 to
#   /trbillo/, so no `redir` is needed here.
# - `reverse_proxy` automatically upgrades WebSocket requests, so
#   /trbillo/api/ws and /trbillo/api/ws/user work without extra config.
# - The session cookie is scoped to /trbillo, so a static site or another
#   app at the root of the same host never sees it.
# - After editing the Caddyfile:
#       sudo caddy validate --config /etc/caddy/Caddyfile
#       sudo systemctl reload caddy
